name: build-data
on:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The CLI writes nothing when the new dataset hashes the same as the committed one.
      - run: node tools/build-data/src/cli.js --out app/public/data
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain app/public/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/public/data
            git commit -m "data: ATT&CK $(jq -r .attackVersion app/public/data/version.json)"
            git push
          fi
