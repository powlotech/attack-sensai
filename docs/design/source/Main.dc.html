<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Learn home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E74}a:hover{color:#0A4F53}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F5F2; color: #16181D; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden">
  <header style="padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Learn</h1>
    <p style="margin: 0; font-size: 15px; color: #4A4F57; line-height: 1.4">The 14 attacker goals, in the order an attack usually unfolds.</p>
  </header>

  <div style="margin: 4px 20px 12px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DADDD6; border-radius: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 600">Your progress</span>
      <span style="font-size: 13px; color: #4A4F57">12 techniques learned</span>
    </div>
    <div style="height: 8px; background: #E6E8E3; border-radius: 4px; overflow: hidden">
      <div style="width: 9%; height: 8px; background: {{accent}}; border-radius: 4px"></div>
    </div>
    <a href="Onboarding.dc.html" style="font-size: 14px; font-weight: 500; text-decoration: none">Replay the intro</a>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{tactics}}" as="t" hint-placeholder-count="7">
      <a href="Matrix.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 10px 14px; background: #FFFFFF; border: 1px solid #DADDD6; border-radius: 14px; text-decoration: none; color: #16181D; box-sizing: border-box">
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #E3F0F0; color: #0A4F53; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{t.n}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="display: flex; gap: 8px; align-items: baseline">
            <span style="font-size: 16px; font-weight: 600">{{t.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B606A">{{t.id}}</span>
          </span>
          <span style="font-size: 14px; color: #4A4F57; line-height: 1.35">{{t.goal}}</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="display: flex; height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #DADDD6">
    <a href="Main.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path></svg>Learn</a>
    <a href="Matrix.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Matrix</a>
    <a href="Search.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
    <a href="Layers.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Layers</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E74","options":["#0F6E74","#2F4FA8","#7A3E9D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#0F6E74',
      tactics: [
        { n: 1, name: 'Reconnaissance', id: 'TA0043', goal: 'Researching the target before attacking' },
        { n: 2, name: 'Resource Development', id: 'TA0042', goal: 'Setting up tools, accounts and servers' },
        { n: 3, name: 'Initial Access', id: 'TA0001', goal: 'Getting a first foothold inside' },
        { n: 4, name: 'Execution', id: 'TA0002', goal: "Running the attacker's code" },
        { n: 5, name: 'Persistence', id: 'TA0003', goal: 'Staying in after a reboot or password change' },
        { n: 6, name: 'Privilege Escalation', id: 'TA0004', goal: 'Gaining higher permissions' },
        { n: 7, name: 'Defense Evasion', id: 'TA0005', goal: 'Avoiding being spotted' }
      ]
    };
  }
}
</script>
</body>
</html>
