<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matrix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E74}a:hover{color:#0A4F53}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F5F2; color: #16181D; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden">
  <header style="padding: 24px 20px 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Matrix</h1>
    <button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #C5C9C2; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #16181D; display: flex; align-items: center; gap: 6px">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #E07A2E"></span>Learning progress
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </header>

  <div style="margin: 0 20px 10px; display: flex; background: #E6E8E3; border-radius: 12px; padding: 4px; flex-shrink: 0" role="tablist" aria-label="Matrix view">
    <span role="tab" aria-selected="true" style="flex: 1; height: 40px; border-radius: 9px; background: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center">List</span>
    <a href="MatrixOverview.dc.html" role="tab" aria-selected="false" style="flex: 1; height: 40px; border-radius: 9px; font-size: 14px; font-weight: 500; color: #33373D; text-decoration: none; display: flex; align-items: center; justify-content: center">Overview</a>
  </div>

  <div style="display: flex; gap: 8px; padding: 4px 20px 12px; overflow: hidden; flex-shrink: 0">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button type="button" style="{{c.style}}">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
    <button type="button" style="height: 52px; flex-shrink: 0; padding: 0 20px; border: 0; border-top: 1px solid #DADDD6; background: #EDEFEA; font-family: inherit; display: flex; align-items: center; gap: 10px; color: #16181D; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B606A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      <span style="font-size: 16px; font-weight: 600; flex: 1">Initial Access</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B606A">TA0001</span>
    </button>

    <button type="button" style="height: 52px; flex-shrink: 0; padding: 0 20px; border: 0; border-top: 1px solid #DADDD6; background: #E3F0F0; font-family: inherit; display: flex; align-items: center; gap: 10px; color: #0A4F53; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      <span style="font-size: 16px; font-weight: 700; flex: 1">Execution <span style="font-weight: 400; font-size: 14px">· Running the attacker's code</span></span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">TA0002</span>
    </button>

    <div style="background: #FFFFFF; display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
        <a href="Technique.dc.html" style="{{r.rowStyle}}">
          <span style="{{r.dotStyle}}">{{r.score}}</span>
          <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: {{r.weight}}; line-height: 1.3">{{r.name}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B606A">{{r.id}}</span>
          <sc-if value="{{r.hasSubs}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 12px; color: #0A4F53; background: #E3F0F0; border-radius: 10px; padding: 2px 8px">{{r.subs}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>

    <button type="button" style="height: 52px; flex-shrink: 0; padding: 0 20px; border: 0; border-top: 1px solid #DADDD6; background: #EDEFEA; font-family: inherit; display: flex; align-items: center; gap: 10px; color: #16181D; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B606A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      <span style="font-size: 16px; font-weight: 600; flex: 1">Persistence</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B606A">TA0003</span>
    </button>
  </div>

  <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: #FFFFFF; border-top: 1px solid #DADDD6; font-size: 13px; color: #4A4F57">
    <span>Score</span>
    <sc-for list="{{legend}}" as="l" hint-placeholder-count="5">
      <span style="display: flex; align-items: center; gap: 4px"><span style="{{l.style}}"></span>{{l.n}}</span>
    </sc-for>
    <span style="flex: 1"></span>
    <span>0 = not looked at</span>
  </div>

  <nav aria-label="Main" style="display: flex; height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #DADDD6">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path></svg>Learn</a>
    <a href="Matrix.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0F6E74; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Matrix</a>
    <a href="Search.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
    <a href="Layers.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Layers</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const fills = ['#FFFFFF', '#FCE7C8', '#F6B76B', '#E07A2E', '#9A3F0E'];
    const ink = ['#5B606A', '#5C3A0F', '#4A2A05', '#FFFFFF', '#FFFFFF'];
    const dot = (s) => `width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; box-sizing: border-box; border: 1.5px solid ${s === 0 ? '#C5C9C2' : fills[s]}; background: ${fills[s]}; color: ${ink[s]}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center`;
    const data = [
      { name: 'Command and Scripting Interpreter', id: 'T1059', score: 2, subs: 'subs open', sub: false },
      { name: 'PowerShell', id: '.001', score: 3, sub: true },
      { name: 'Windows Command Shell', id: '.003', score: 2, sub: true },
      { name: 'Unix Shell', id: '.004', score: 1, sub: true },
      { name: 'Python', id: '.006', score: 0, sub: true },
      { name: 'Exploitation for Client Execution', id: 'T1203', score: 0, sub: false },
      { name: 'Scheduled Task/Job', id: 'T1053', score: 4, subs: '+ subs', sub: false },
      { name: 'User Execution', id: 'T1204', score: 1, subs: '+ subs', sub: false },
      { name: 'Windows Management Instrumentation', id: 'T1047', score: 2, sub: false }
    ];
    const rows = data.map((r) => ({
      ...r,
      hasSubs: !!r.subs,
      weight: r.sub ? 400 : 500,
      dotStyle: dot(r.score),
      rowStyle: `min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 8px 20px 8px ${r.sub ? 52 : 20}px; border-top: 1px solid #ECEEE9; text-decoration: none; color: #16181D; box-sizing: border-box; background: ${r.sub ? '#FAFBF9' : '#FFFFFF'}`
    }));
    const chipLabels = ['Recon', 'Resource Dev', 'Initial Access', 'Execution', 'Persistence', 'Priv Esc'];
    const chips = chipLabels.map((label) => ({
      label,
      style: label === 'Execution'
        ? "height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 20px; border: 0; background: #0F6E74; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600"
        : "height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 20px; border: 1px solid #C5C9C2; background: #FFFFFF; color: #16181D; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500"
    }));
    const legend = [0, 1, 2, 3, 4].map((n) => ({ n, style: `width: 14px; height: 14px; border-radius: 4px; box-sizing: border-box; border: 1.5px solid ${n === 0 ? '#C5C9C2' : fills[n]}; background: ${fills[n]}` }));
    return { rows, chips, legend };
  }
}
</script>
</body>
</html>
