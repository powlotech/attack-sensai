<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E74}a:hover{color:#0A4F53}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F5F2; color: #16181D; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden">
  <header style="padding: 24px 20px 12px; display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Layers</h1>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #0F6E74; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New</button>
  </header>
  <p style="margin: 0 20px 14px; font-size: 14px; line-height: 1.45; color: #4A4F57">A layer is your own colouring of the matrix: progress, a threat group, or your detections. The active layer's scores show everywhere.</p>

  <div style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{layers}}" as="l" hint-placeholder-count="3">
      <div style="{{l.cardStyle}}">
        <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="flex: 1; min-height: 64px; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; font-family: inherit; text-align: left; padding: 0; color: #16181D">
          <span style="{{l.radioStyle}}"><span style="{{l.radioDot}}"></span></span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 16px; font-weight: 600">{{l.name}}</span>
            <span style="font-size: 13px; color: #4A4F57">{{l.meta}}</span>
          </span>
        </button>
        <button type="button" aria-label="Layer options" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #4A4F57">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
        </button>
      </div>
    </sc-for>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px">
      <button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #0F6E74; background: #FFFFFF; color: #0A4F53; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Import Navigator file (.json)</button>
      <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #0F6E74; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"></path></svg>Share / export active layer</button>
      <span style="font-size: 13px; color: #4A4F57; text-align: center">Exports open in the official MITRE ATT&amp;CK Navigator.</span>
    </div>
  </div>

  <div style="margin: 0 20px 14px; padding: 12px 14px; border-radius: 12px; background: #E6E8E3; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #33373D">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
    <span style="flex: 1">ATT&amp;CK data [version] · checked [date]</span>
    <button type="button" style="height: 36px; padding: 0 10px; border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #0A4F53">Check now</button>
  </div>

  <nav aria-label="Main" style="display: flex; height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #DADDD6">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path></svg>Learn</a>
    <a href="Matrix.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Matrix</a>
    <a href="Search.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
    <a href="Layers.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0F6E74; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Layers</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 0 };
  }
  renderVals() {
    const data = [
      { name: 'Learning progress', meta: '12 scored · edited today' },
      { name: 'APT29', meta: 'From search · [n] techniques' },
      { name: 'My detections', meta: 'Imported from detections.json' }
    ];
    const layers = data.map((l, i) => {
      const on = this.state.active === i;
      return {
        ...l,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ active: i }),
        cardStyle: `display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; background: #FFFFFF; border-radius: 14px; border: ${on ? '2px solid #0F6E74' : '1px solid #DADDD6'}`,
        radioStyle: `width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; box-sizing: border-box; border: 2px solid ${on ? '#0F6E74' : '#8A8F98'}; display: flex; align-items: center; justify-content: center`,
        radioDot: `width: 10px; height: 10px; border-radius: 5px; background: ${on ? '#0F6E74' : 'transparent'}`
      };
    });
    return { layers };
  }
}
</script>
</body>
</html>
