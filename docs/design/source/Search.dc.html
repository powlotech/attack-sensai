<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E74}a:hover{color:#0A4F53}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F5F2; color: #16181D; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden">
  <header style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Search</h1>
    <label style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #FFFFFF; border: 2px solid #0F6E74; border-radius: 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" value="apt29" aria-label="Search techniques, groups, software or IDs" style="flex: 1; border: 0; outline: none; font-family: inherit; font-size: 17px; background: transparent; min-width: 0">
    </label>
    <div style="display: flex; background: #E6E8E3; border-radius: 12px; padding: 4px" role="tablist">
      <button type="button" role="tab" aria-selected="false" style="flex: 1; height: 40px; border: 0; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #33373D">Techniques</button>
      <button type="button" role="tab" aria-selected="true" style="flex: 1; height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #16181D">Groups</button>
      <button type="button" role="tab" aria-selected="false" style="flex: 1; height: 40px; border: 0; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #33373D">Software</button>
    </div>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{platforms}}" as="p" hint-placeholder-count="5">
        <button type="button" onClick="{{p.toggle}}" aria-pressed="{{p.pressed}}" style="{{p.style}}">{{p.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <article style="background: #FFFFFF; border: 1px solid #DADDD6; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">APT29</h2>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B606A">G0016</span>
      </div>
      <span style="font-size: 14px; color: #4A4F57">Also known as: Cozy Bear, The Dukes, NOBELIUM, Midnight Blizzard</span>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #26292E">[Short MITRE description of the group, loaded from the dataset]</p>
      <div style="display: flex; gap: 8px; margin-top: 4px">
        <a href="Matrix.dc.html" style="flex: 1; height: 48px; border-radius: 12px; background: #0F6E74; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Highlight in matrix</a>
        <a href="Layers.dc.html" style="flex: 1; height: 48px; border-radius: 12px; border: 1px solid #0F6E74; color: #0A4F53; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box">Save as layer</a>
      </div>
    </article>

    <h3 style="margin: 6px 0 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B606A">Techniques it uses · [n] on Windows</h3>
    <div style="background: #FFFFFF; border: 1px solid #DADDD6; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
      <sc-for list="{{techs}}" as="t" hint-placeholder-count="4">
        <a href="Technique.dc.html" style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-top: {{t.border}}; text-decoration: none; color: #16181D; box-sizing: border-box">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span style="font-size: 15px; font-weight: 500">{{t.name}}</span>
            <span style="font-size: 13px; color: #5B606A">{{t.tactic}}</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B606A">{{t.id}}</span>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="display: flex; height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #DADDD6">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path></svg>Learn</a>
    <a href="Matrix.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Matrix</a>
    <a href="Search.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0F6E74; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
    <a href="Layers.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B606A; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Layers</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { Windows: true } };
  }
  renderVals() {
    const labels = ['Windows', 'Linux', 'macOS', 'Cloud', 'Network'];
    const platforms = labels.map((label) => {
      const on = !!this.state.on[label];
      return {
        label,
        pressed: on ? 'true' : 'false',
        toggle: () => this.setState({ on: { ...this.state.on, [label]: !on } }),
        style: on
          ? "height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 20px; border: 0; background: #16181D; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600"
          : "height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 20px; border: 1px solid #C5C9C2; background: #FFFFFF; color: #16181D; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500"
      };
    });
    const techs = [
      { name: 'PowerShell', tactic: 'Execution', id: 'T1059.001' },
      { name: 'Valid Accounts', tactic: 'Initial Access · Persistence · +2', id: 'T1078' },
      { name: 'Obfuscated Files or Information', tactic: 'Defense Evasion', id: 'T1027' },
      { name: 'Spearphishing Link', tactic: 'Initial Access', id: 'T1566.002' }
    ].map((t, i) => ({ ...t, border: i === 0 ? '0' : '1px solid #ECEEE9' }));
    return { platforms, techs };
  }
}
</script>
</body>
</html>
